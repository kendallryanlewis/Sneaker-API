steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
  
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sneaker-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sneaker-api:latest'
      - '.'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sneaker-api:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sneaker-api:latest']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sneaker-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sneaker-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/sneaker-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sneaker-api:latest'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
