steps:
  # Deploy to Cloud Run using source-based deployment.
  # Cloud Build handles the Docker image build and Artifact Registry push automatically.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sneaker-api'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=production'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
